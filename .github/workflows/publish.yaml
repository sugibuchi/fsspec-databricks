name: Publish Python package

on:
  workflow_call:
    inputs:
      environment:
        description: "The environment to publish to. Should be either 'pypi' or 'testpypi'."
        type: string
        required: true
      python-version:
        description: "The Python version to use for building and publishing the package."
        type: string
        required: true

concurrency:
  group: "publish-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      # Without a cache: the cache is disabled on release events by default, against cache poisoning
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"

      - name: Build Python package
        run: uv build

      - name: Publish Python package
        run: uv publish
