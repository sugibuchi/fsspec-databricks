name: Test Python package
run-name: Test the Python package

on:
  workflow_call:
    inputs:
      python-version:
        description: "The Python version to use for testing the package."
        type: string
        required: true
      coverage:
        description: "Whether to run tests with coverage reporting."
        type: boolean
        required: false
        default: false
      environment:
        description: "The environment to run tests"
        type: string
        required: true
    secrets:
      DATABRICKS_HOST:
        required: true
      DATABRICKS_CLIENT_ID:
        required: false
      DATABRICKS_CLIENT_SECRET:
        required: false

  workflow_dispatch:
    inputs:
      python-version:
        description: "The Python version to use for testing the package."
        type: string
        required: true
        default: "3.14"
      coverage:
        description: "Whether to run tests with coverage reporting."
        type: boolean
        required: true
        default: false
      environment:
        description: "The environment to run tests"
        type: choice
        required: true
        options:
          - default
          - azure
          - aws
          - gcp
        default: default


permissions:
  contents: read

concurrency:
  group: "test-${{ inputs.environment }}-${{ github.ref_name }}-${{ inputs.python-version }}"
  cancel-in-progress: false

jobs:

  test:
    name: Test Python package
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # GitHub's OIDC token, for identity federation with Databricks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Set up env variables for working directories
        shell: bash
        run: |
          test_path="${{ github.ref_name }}/${{ inputs.python-version }}"

          has_error=no
          if [[ "${{ vars.FSSPEC_DATABRICKS_VOLUME_TEST_ROOT }}" == "" ]]; then
            echo "GitHub Actions variable FSSPEC_DATABRICKS_VOLUME_TEST_ROOT must be set."
            has_error=yes
          else
            echo "FSSPEC_DATABRICKS_VOLUME_TEST_ROOT=${{ vars.FSSPEC_DATABRICKS_VOLUME_TEST_ROOT }}/${test_path}" >> $GITHUB_ENV
          fi

          if [[ "${{ vars.FSSPEC_DATABRICKS_WORKSPACE_TEST_ROOT }}" == "" ]]; then
            echo "GitHub Actions variable FSSPEC_DATABRICKS_WORKSPACE_TEST_ROOT must be set."
            has_error=yes
          else
            echo "FSSPEC_DATABRICKS_WORKSPACE_TEST_ROOT=${{ vars.FSSPEC_DATABRICKS_WORKSPACE_TEST_ROOT }}/${test_path}" >> $GITHUB_ENV
          fi

          if [[ "$has_error" = "yes" ]]; then
            exit 1
          fi

      - name: Run test
        if: ${{ !inputs.coverage }}
        shell: bash
        # The environment's DATABRICKS_AUTH_TYPE chooses identity federation. Without it, the client secret is used.
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: ${{ vars.DATABRICKS_AUTH_TYPE || 'oauth-m2m' }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ !vars.DATABRICKS_AUTH_TYPE && secrets.DATABRICKS_CLIENT_SECRET || '' }}
          DATABRICKS_TOKEN_AUDIENCE: ${{ vars.DATABRICKS_TOKEN_AUDIENCE }}
          ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
        run: |
          bash .github/scripts/with-id-token-file.sh uv run pytest

      - name: Run test with coverage
        if: ${{ inputs.coverage }}
        shell: bash
        # The same as "Run test"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: ${{ vars.DATABRICKS_AUTH_TYPE || 'oauth-m2m' }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ !vars.DATABRICKS_AUTH_TYPE && secrets.DATABRICKS_CLIENT_SECRET || '' }}
          DATABRICKS_TOKEN_AUDIENCE: ${{ vars.DATABRICKS_TOKEN_AUDIENCE }}
          ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
        run: |
          bash .github/scripts/with-id-token-file.sh uv run pytest --cov \
              --cov-report=term \
              --cov-report=xml:coverage.xml \
              --junitxml=junit.xml \
              -o junit_family=legacy

      - name: Upload coverage to Codecov
        if: ${{ inputs.coverage && !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: coverage

      - name: Upload test results to Codecov
        if: ${{ inputs.coverage && !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
